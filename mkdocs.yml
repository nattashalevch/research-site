site_name: Результаты исследований
site_url: https://nattashalevch.github.io/research-site/
theme:
  name: material
  language: ru
  font: false
  palette:
    scheme: slate
    primary: teal
    accent: amber
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
plugins:
  - search:
      lang: ru
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer
extra:
  version:
    provider: mike
    default: latest
